name: Channel setup

# One-off: About text, keywords and format playlists (see pipeline/channel-setup.mjs).
on:
  workflow_dispatch:

concurrency:
  group: produce
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm install --no-audit --no-fund
      - name: Apply channel settings
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node pipeline/channel-setup.mjs
      - name: Commit playlist ids
        if: always()
        run: |
          git config user.name "crypto-shorts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state 2>/dev/null || true
          git diff --staged --quiet || git commit -m "auto: channel setup"
          git pull --rebase -q && git push || true
