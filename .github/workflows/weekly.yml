name: Produce weekly recap

on:
  schedule:
    # Sunday and Wednesday, 5pm US Eastern. Cron is fixed UTC and does not
    # follow US daylight saving time - 21:00 UTC = 5pm EDT (Mar-Nov). During
    # EST (Nov-Mar) this fires at 4pm ET instead; adjust to "0 22 * * 0" if
    # you want it pinned to EST months instead.
    # GitHub delays or drops cron runs: two backup triggers follow, the guard step skips
    # them once a weekly run has succeeded today.
    - cron: "29 21 * * 0"
    - cron: "29 22 * * 0"
    - cron: "29 23 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Render but do not upload
        type: boolean
        default: false
      auto:
        description: External scheduler call - skip if this week's recap was already made today
        type: boolean
        default: false

concurrency:
  group: weekly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  guard:
    if: github.event_name == 'schedule' || inputs.auto
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        run: |
          # look at the latest master, not the commit that triggered this (possibly late) run
          git fetch -q origin master
          if git ls-tree --name-only origin/master archive/ | grep -q "archive/$(date -u +%F)-.*-weekly.json"; then
            echo "go=0" >> "$GITHUB_OUTPUT"; echo "weekly recap already made today, nothing to do"
          else echo "go=1" >> "$GITHUB_OUTPUT"; fi

  produce:
    needs: guard
    if: always() && ((github.event_name != 'schedule' && !inputs.auto) || needs.guard.outputs.go == '1')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: System libraries for headless Chrome + ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libxfixes3 \
            libpango-1.0-0 libcairo2 libcups2 fonts-liberation || true
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install dependencies
        run: |
          npm ci || npm install --no-audit --no-fund
          pip install --disable-pip-version-check -r requirements.txt
          npx remotion browser ensure || true

      - name: Produce and publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5' }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'unlisted' }}
          YOUTUBE_CATEGORY_ID: ${{ vars.YOUTUBE_CATEGORY_ID || '28' }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TTS_VOICE: ${{ vars.TTS_VOICE || 'en-US-AndrewMultilingualNeural' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node pipeline/render-weekly.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Keep the rendered file for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-${{ github.run_number }}
          path: |
            out/*.mp4
            out/weekly-props.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit run state
        if: always()
        run: |
          git config user.name "crypto-shorts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state archive 2>/dev/null || true
          git diff --staged --quiet || git commit -m "auto: weekly run ${{ github.run_number }}"
          git push || true
