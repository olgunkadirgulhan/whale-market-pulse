name: Produce crypto short

on:
  schedule:
    # Three videos a day, UTC: open (from 13:00 = 09 ET, US market open), mover (from 17:00 = 13 ET),
    # trending (from 20:00 = 16 ET). ET afternoon did best on 09-22..26; the 05 ET open got ~40 views.
    # GitHub often fires crons hours late or drops them, so there are backup triggers. The "Pick slot"
    # step produces the earliest slot that is due and not yet in archive/ today, or skips: never more than 2/day.
    # Hourly and off the :00 mark, where GitHub drops the most runs (09:00/11:00 never fired).
    - cron: "17 13-23 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: Which format to produce
        type: choice
        default: open
        options: [open, mover, trending]
      dry_run:
        description: Render but do not upload
        type: boolean
        default: false
      auto:
        description: External scheduler call - pick the due slot like a scheduled run (slot input ignored)
        type: boolean
        default: false

concurrency:
  group: produce
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Pick slot
        id: pick
        run: |
          [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.auto }}" = "true" ] || exit 0
          # look at the latest master, not the commit that triggered this (possibly late) run
          git fetch -q origin master
          today=$(date -u +%F); hour=$((10#$(date -u +%H)))
          done_today=$(git ls-tree --name-only origin/master archive/ | grep "archive/$today-" || true)
          for pair in mover:17 trending:20; do  # 2026-10-08: hacim 3→2, genel "open" özeti kaldırıldı (en zayıf)
            s=${pair%%:*}; h=${pair##*:}
            if [ "$hour" -ge "$h" ] && ! printf '%s\n' "$done_today" | grep -q -- "-$s.json"; then
              echo "slot=$s" >> "$GITHUB_OUTPUT"; echo "producing slot: $s"; exit 0
            fi
          done
          echo "skip=1" >> "$GITHUB_OUTPUT"; echo "every due slot already produced today, nothing to do"

      - uses: actions/setup-node@v4
        if: steps.pick.outputs.skip != '1'
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        if: steps.pick.outputs.skip != '1'
        with:
          python-version: "3.12"

      - name: Cache npm
        if: steps.pick.outputs.skip != '1'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: System libraries for headless Chrome + ffmpeg
        if: steps.pick.outputs.skip != '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libxfixes3 \
            libpango-1.0-0 libcairo2 libcups2 fonts-liberation || true
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true
          # ffmpeg is NOT guaranteed preinstalled on ubuntu-latest - install it
          # explicitly. The apt package ships both ffmpeg and ffprobe together.
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install dependencies
        if: steps.pick.outputs.skip != '1'
        run: |
          npm ci || npm install --no-audit --no-fund
          pip install --disable-pip-version-check -r requirements.txt
          npx remotion browser ensure || true

      - name: Produce and publish
        if: steps.pick.outputs.skip != '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5' }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'unlisted' }}
          YOUTUBE_CATEGORY_ID: ${{ vars.YOUTUBE_CATEGORY_ID || '28' }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TTS_VOICE: ${{ vars.TTS_VOICE || 'en-US-AndrewMultilingualNeural' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node pipeline/run.mjs \
            ${{ steps.pick.outputs.slot && format('--slot={0}', steps.pick.outputs.slot) || (inputs.slot && format('--slot={0}', inputs.slot)) || '' }} \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Keep the rendered file for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            out/*.mp4
            out/*-thumb.png
            out/props.json
          retention-days: 7
          if-no-files-found: ignore

      # Committing state each run also keeps the schedule alive: GitHub disables
      # cron workflows on repositories with 60 days of no activity.
      - name: Commit run state
        if: always()
        run: |
          git config user.name "crypto-shorts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state archive 2>/dev/null || true
          git diff --staged --quiet || git commit -m "auto: run ${{ github.run_number }}"
          git push || true
